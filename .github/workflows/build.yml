name: build

on:
  push:
    branches: [ main ]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install customtkinter websockets cryptography requests aiortc pyinstaller

      - name: build exe
        run: pyinstaller --onedir --windowed --name chat --hidden-import=requests --hidden-import=charset_normalizer --hidden-import=aiortc --collect-all=customtkinter --collect-all=aiortc client.py

      - name: zip output
        run: Compress-Archive -Path dist/chat -DestinationPath dist/chat-windows.zip

      - name: upload to release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/chat-windows.zip

      - name: upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-windows
          path: dist/chat-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install customtkinter websockets cryptography requests aiortc pyinstaller

      - name: build binary
        run: pyinstaller --onefile --name chat --hidden-import=requests --hidden-import=charset_normalizer --hidden-import=aiortc --collect-all=customtkinter --collect-all=aiortc client.py

      - name: upload binary to release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/chat

      - name: upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-linux
          path: dist/chat
